services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null || exit 1"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 15s

  ollama-init-embed:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./scripts/ollama_ensure_model.sh:/ensure-model.sh:ro
    entrypoint: ["/bin/sh"]
    command:
      [
        "-c",
        "tr -d '\\r' < /ensure-model.sh | sh -s -- qwen3-embedding:4b embedding",
      ]
    restart: "no"

  ollama-init-llm:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init-embed:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./scripts/ollama_ensure_model.sh:/ensure-model.sh:ro
    entrypoint: ["/bin/sh"]
    command:
      [
        "-c",
        "tr -d '\\r' < /ensure-model.sh | sh -s -- qwen3:4b generation",
      ]
    restart: "no"

  grounded-answer:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init-embed:
        condition: service_completed_successfully
      ollama-init-llm:
        condition: service_completed_successfully
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_LLM_TIMEOUT_SECONDS: ${OLLAMA_LLM_TIMEOUT_SECONDS:-300}
      INDEX_DIR: /app/data/index
      PYTHONPATH: /app/src
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-60}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - index_data:/app/data/index
    stdin_open: true
    tty: true

volumes:
  ollama_data:
  index_data:
